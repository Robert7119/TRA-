<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Government Tax Portal</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <h1>National Revenue Office</h1>
        <p>Taxpayer Payment & Estimation Portal</p>
      </header>

      <main class="grid">
        <section class="card">
          <h2>Estimate Tax</h2>
          <form id="tax-form">
            <label>
              Taxpayer Name
              <input type="text" id="taxpayerName" placeholder="Amina Hassan" required />
            </label>

            <label>
              Annual Income
              <input type="number" id="annualIncome" min="0" step="0.01" placeholder="65000" required />
            </label>

            <label>
              Deductions
              <input type="number" id="deductions" min="0" step="0.01" value="0" />
            </label>

            <label>
              Filing Status
              <select id="filingStatus">
                <option value="single">Single</option>
                <option value="married">Married</option>
                <option value="headOfHousehold">Head of Household</option>
              </select>
            </label>

            <button type="submit">Calculate Tax</button>
          </form>

          <div id="tax-result" class="result-box">
            <h3>Tax Summary</h3>
            <p>No calculation yet.</p>
          </div>
        </section>

        <section class="card">
          <h2>Submit Payment</h2>
          <form id="payment-form">
            <label>
              Taxpayer Name
              <input type="text" id="paymentTaxpayerName" placeholder="Amina Hassan" required />
            </label>

            <label>
              Annual Income
              <input type="number" id="paymentAnnualIncome" min="0" step="0.01" placeholder="65000" required />
            </label>

            <label>
              Amount to Pay
              <input type="number" id="amount" min="0" step="0.01" placeholder="5000" required />
            </label>

            <label>
              Payment Method
              <select id="paymentMethod">
                <option value="Bank Transfer">Bank Transfer</option>
                <option value="Credit Card">Credit Card</option>
                <option value="Mobile Wallet">Mobile Wallet</option>
              </select>
            </label>

            <label>
              Filing Status
              <select id="paymentFilingStatus">
                <option value="single">Single</option>
                <option value="married">Married</option>
                <option value="headOfHousehold">Head of Household</option>
              </select>
            </label>

            <button type="submit">Submit Payment</button>
          </form>

          <div id="payment-result" class="result-box success">
            <h3>Payment Status</h3>
            <p>No payment submitted yet.</p>
          </div>
        </section>
      </main>

      <section class="card table-card">
        <h2>Recent Payments</h2>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Income</th>
              <th>Amount</th>
              <th>Method</th>
              <th>Submitted</th>
            </tr>
          </thead>
          <tbody id="payments-table-body">
            <tr>
              <td colspan="6">No payment records yet.</td>
            </tr>
          </tbody>
        </table>
      </section>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
